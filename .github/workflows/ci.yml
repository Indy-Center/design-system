name: CI

# workflow_call lets a later publish workflow (none yet) run these checks
# first, as indy-larry's build-and-deploy.yml does. The push trigger covers
# the Centerline feature branch while its tickets land on it.
on:
  pull_request:
  push:
    branches: [centerline/packages]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # The token tests render the built CSS in headless Chromium.
      - name: Install Chromium
        run: npx playwright-core install --with-deps --only-shell chromium

      - name: Test
        run: npm test

      # Lists what npm would publish for each package, so a broken package
      # fails here rather than at npm publish.
      - name: Pack
        run: npm run pack:dry-run
