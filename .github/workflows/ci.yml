name: CI

# No push trigger: on a push to main, build-and-deploy.yml and publish.yml
# each run these checks first through workflow_call, so neither deploys nor
# publishes a commit that fails them.
on:
  pull_request:
  workflow_call:
  # Temporary, to run the checks on this branch before its PR.
  push:
    branches: [centerline/webkit-ci]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Build the playground
        run: npm run build:playground -w packages/svelte

      # The token tests render the built CSS in headless Chromium.
      - name: Install Chromium
        run: npx playwright-core install --with-deps --only-shell chromium

      - name: Test
        run: npm test

      # Lists what npm would publish for each package, so a broken package
      # fails here rather than at npm publish.
      - name: Pack
        run: npm run pack:dry-run

  # The component tests in Playwright's WebKit, Safari's engine, on macOS,
  # where it behaves as Safari does there (a click doesn't focus a button).
  # The token tests and svelte-check run in `check` only.
  webkit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build -w packages/tokens && npm run build -w packages/svelte

      - name: Install WebKit
        run: npx playwright install webkit

      - name: Test in WebKit
        working-directory: packages/svelte
        run: npx vitest run --project components
        env:
          CENTERLINE_BROWSER: webkit
